name: Release

# One-button releases: press "Run workflow" on main (Actions → Release)
# and everything happens — the version is read from Cargo.toml, the full
# verification gate runs, binaries build for macOS and Linux, and a GitHub
# Release is published with the v<version> tag created server-side.
# Pushing a v* tag still works as a manual path. See README "Install".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = v<version> from Cargo.toml)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the tag and refuse re-releases
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] \
             && git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "::error::${tag} already exists — bump version in Cargo.toml first"
            exit 1
          fi

  verify:
    name: Verify before release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p openade-daemon -p catalog-mcp

      - name: Package
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          version="${tag#v}"
          pkg="openade-${version}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}"
          cp "target/${{ matrix.target }}/release/openade-daemon" \
             "target/${{ matrix.target }}/release/catalog-mcp" \
             LICENSE README.md "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          (cd dist && shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: openade-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
