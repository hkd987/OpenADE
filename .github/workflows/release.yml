name: Release

# Hands-off releases: every push/merge to main reads the version from
# Cargo.toml — if v<version> hasn't been released yet, the pipeline runs
# the verification gate, builds macOS + Linux binaries, and publishes the
# GitHub Release (tag created server-side). Pushes that don't bump the
# version resolve to "already released" and skip everything. Tag pushes
# and manual dispatch remain as fallback paths. See README "Install".

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = v<version> from Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the tag; skip versions that are already released
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}" ] \
               && [ "${{ github.event_name }}" = "push" ] \
               && case "$GITHUB_REF" in refs/tags/*) true;; *) false;; esac; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/tags/${tag}" ]; then
            # The tag push itself is the release request.
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            if [ -n "${{ github.event.inputs.tag }}" ]; then
              echo "::error::${tag} already exists — bump version in Cargo.toml first"
              exit 1
            fi
            echo "${tag} is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${tag}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify before release
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, verify]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Intel macOS is cross-compiled from the arm64 runner: the
          # macos-13 (Intel) runner image is retired and jobs requesting
          # it queue forever.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p openade-daemon -p catalog-mcp -p openade-server

      - name: Package
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          version="${tag#v}"
          pkg="openade-${version}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}"
          cp "target/${{ matrix.target }}/release/openade-daemon" \
             "target/${{ matrix.target }}/release/catalog-mcp" \
             "target/${{ matrix.target }}/release/openade-server" \
             LICENSE README.md "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          (cd dist && shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: openade-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    needs: [resolve, build]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
