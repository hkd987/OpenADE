[workspace]
resolver = "2"
members = [
    "crates/openade-core",
    "crates/openade-daemon",
    "crates/catalog-mcp",
    "crates/openade-server",
]
# The Tauri shell crate needs platform system libraries (WebKit/GTK on Linux)
# and is built separately — see apps/desktop/README.md.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hkd987/OpenADE"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

# dev-dependencies
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
wiremock = "0.6"
