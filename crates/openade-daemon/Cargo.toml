[package]
name = "openade-daemon"
description = "OpenADE session daemon: PTY host, Git worktree manager, harness adapters, transcript recorder, local HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
catalog-mcp = { path = "../catalog-mcp" }
chrono.workspace = true
openade-core = { path = "../openade-core" }
portable-pty.workspace = true
openade-server = { path = "../openade-server" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
catalog-mcp = { path = "../catalog-mcp", features = ["mock"] }
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true

[[bin]]
name = "openade-daemon"
path = "src/main.rs"
